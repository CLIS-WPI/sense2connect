# M2 radio defaults on the same street as configs/m1_scenario.yaml.
# M1 stays on the single-element, single-O-RU file so that study can be repeated.
# Seed 101 is a tuning seed (configs/seeds.yaml).
seed: 101
carrier_hz: 2.8e10
numerology: 3
n_subcarriers: 512
dt_s: 0.1
duration_s: 2.0
# lamppost -> 5 m, facade -> 8 m. The study sweeps both.
mount: facade
density: low

# O-RU: 8x8 uniform planar array, half-wavelength spacing, synthetic array.
# UE: one element. Both solves use these arrays.
array:
  synthetic_array: true
  oru:
    num_rows: 8
    num_cols: 8
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    polarization: V
    pattern: iso
  ue:
    num_rows: 1
    num_cols: 1
    vertical_spacing: 0.5
    horizontal_spacing: 0.5
    polarization: V
    pattern: iso

# Lamppost at 5 m on the sidewalk opposite the first O-RU, 40 m along the street.
second_oru:
  enabled: true
  height_m: 5.0
  x_offset_m: 40.0

scene: simple_street_canyon

solvers:
  max_depth: 2
  samples_per_src: 20000
  max_num_paths_per_src: 10000
  samples_per_sp: 20000
  buffer_size_per_sp: 20000
  specular_reflection: true
  diffraction: false
  refraction: false

blockage:
  # A blocker is in a per-path event while its model-B loss on that path is at least this [dB].
  event_loss_db: 3.0
  # UE-level events use these thresholds [dB]. 10 dB is the primary one.
  ue_thresholds_db: [3.0, 10.0, 20.0]
  # Gaps shorter than this [s] are one UE event.
  # 0.5 s had the fewest gap-only inversions on the tuning seeds.
  # Longer dips that stay above 3 dB are closed by nesting 10 dB inside the 3 dB event.
  min_gap_s: 0.5
  # A blocker is "in view" inside this range [m] of the O-RU.
  sensing_range_m: 40.0

# Street between the canyon facades (north wall near y = 9.6, south wall near y = -8.6).
# Positions wrap on length_m so a 60 s run keeps the same density.
lanes:
  - name: eastbound
    origin_m: [-40.0, -2.5, 0.0]
    direction: [1.0, 0.0, 0.0]
    length_m: 80.0
  - name: westbound
    origin_m: [40.0, 2.5, 0.0]
    direction: [-1.0, 0.0, 0.0]
    length_m: 80.0
sidewalks:
  - name: south
    origin_m: [-40.0, -7.0, 0.0]
    direction: [1.0, 0.0, 0.0]
    length_m: 80.0
  - name: north
    origin_m: [-40.0, 6.5, 0.0]
    direction: [1.0, 0.0, 0.0]
    length_m: 80.0

# Horizontal position is the mount. Height is the deployment parameter.
oru_mounts:
  lamppost:
    height_m: 5.0
    x_m: 12.0
    y_m: 6.5
  facade:
    height_m: 8.0
    x_m: 0.0
    y_m: 9.2

# Centers sit at half the height so the body rests on the ground.
blocker_kinds:
  car:
    object_type: vehicle-multi-sp
    length_m: 5.0
    width_m: 2.0
    height_m: 1.6
    speed_mps: [8.0, 12.0]
  bus:
    object_type: vehicle-multi-sp
    length_m: 12.0
    width_m: 2.5
    height_m: 3.2
    speed_mps: [6.0, 10.0]
  truck:
    object_type: vehicle-multi-sp
    length_m: 8.0
    width_m: 2.5
    height_m: 3.5
    speed_mps: [6.0, 10.0]
  pedestrian:
    object_type: human
    length_m: 0.5
    width_m: 0.5
    height_m: 1.75
    speed_mps: [1.0, 1.5]

# Sidewalk walkers are independent of the UEs: both sidewalks, both directions.
# Crossings add people who walk across the street at a random along-street station.
traffic:
  low:
    n_cars: 4
    n_buses: 1
    n_trucks: 1
    n_sidewalk_pedestrians: 6
    n_crossing_pedestrians: 2
  high:
    n_cars: 12
    n_buses: 2
    n_trucks: 2
    n_sidewalk_pedestrians: 12
    n_crossing_pedestrians: 4

ues:
  - name: ue-0
    sidewalk: south
    s0_m: 20.0
    speed_mps: 1.2
    height_m: 1.5
  - name: ue-1
    sidewalk: south
    s0_m: 45.0
    speed_mps: 1.0
    height_m: 1.5

render:
  enabled: true
  every: 10
  resolution: [640, 480]
  num_samples: 32
  camera_position_m: [22.0, 0.5, 8.0]
  camera_look_at_m: [0.0, -2.0, 1.2]
