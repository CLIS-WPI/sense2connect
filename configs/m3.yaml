# M3: blockage prediction and xApp handover. Sensing detections stay in the
# M2 cache. Comm carrier matches the main sensing setting.
seed: 101
duration_s: 60.0
dt_sense_s: 0.1
dt_comm_s: 0.01

comm_radio:
  # Same O-RU radio as the M2 sensing transmitter.
  tx_power_dbm: 30.0
  noise_figure_db: 7.0
  temperature_k: 290.0
  # Outage: SNR below this [dB]. Also report the M1 10 dB LoS-loss events.
  outage_snr_db: 0.0
  # Shannon cap: TS 38.214 Table 5.1.3.1-2 MCS 27 (256QAM).
  max_spectral_efficiency: 7.4063

sensing:
  overhead: 0.07142857142857142  # 1/14
  clutter: blind
  ghost: image
  map_tracker:
    association_m: 4.0
    coast: 8
    process_q: 0.25
    lane_gate_m: 2.5
    sidewalk_gate_m: 2.5
    leave_m: 4.0
  budgets:
    2:
      train: 4
      pfa: 0.001
      eps_m: 5.0
      ghost_association_m: 10.0
    4:
      train: 4
      pfa: 0.001
      eps_m: 3.0
      ghost_association_m: 6.0

ue_position:
  # Network knows the UE with this horizontal Gaussian error [m]. Assumption.
  sigma_m: 1.0

e2:
  report_period_s: 0.1
  loop_delay_s: 0.02
  loop_delay_sweep_s: [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
  tau_ho_s: 0.02
  tau_ho_sweep_s: [0.0, 0.02, 0.05, 0.08]

xapp:
  horizon_s: [0.5, 1.0, 2.0]
  hold_s: [0.2, 0.5, 1.0]
  los_block_db: 10.0
  los_clear_db: 3.0

a3:
  # Equal tuning count to the xApp grid (2 budgets x 3 H x 3 hold = 18).
  offset_db: [1.0, 3.0, 5.0]
  hysteresis_db: [1.0, 3.0]
  ttt_s: [0.08, 0.16, 0.32]
  filter_a: 0.5

trend:
  window_s: [0.2, 0.5]
  drop_db: [5.0, 10.0]
  horizon_s: [0.5, 1.0]

# --- M3 rework (2026-10-04). Keys above are the v1 run (scripts/run_m3_v1.py). ---
rework:
  # Link budget fixed before the rerun. 3GPP TR 38.802 V14.2.0, Table A.2.1-1,
  # dense urban, micro layer, above 6 GHz: BS Tx power 33 dBm, UE noise figure
  # 13 dB (baseline). The ray-traced 8x8 O-RU array and the UE use isotropic
  # elements; the 8 dBi element gain of Table A.2.1-6 is NOT added. Cable,
  # body, implementation and shadow-fading losses are "reported by companies"
  # in TR 38.830 V17.0.0 Table A.3: 0 dB here, unspecified by 3GPP.
  budget:
    tx_power_dbm: 33.0
    ue_noise_figure_db: 13.0
    losses_db: 0.0
    source: "3GPP TR 38.802 V14.2.0 Table A.2.1-1 (dense urban micro, >6 GHz); TR 38.830 V17.0.0 Table A.3 (losses reported by companies)"
  v1_radio:  # kept as the high-margin point
    tx_power_dbm: 30.0
    ue_noise_figure_db: 7.0
  # Service rate fixed before the rerun (400 Mbit/s on 122.88 MHz -> SNR 9.32 dB).
  service_rate_bps: 4.0e8
  outage_snr_db: 0.0
  # Margin = median best-cell unblocked SNR (tuning jobs) - SNR_req. Each point
  # adds a common extra path loss on both cells. The 3GPP reference margin is
  # computed, labelled "3GPP short-range reference". Every scheme is tuned at
  # every margin point (user decision, deviates from fixed parameters).
  margins_db: [0.0, 5.0, 10.0, 15.0, 20.0, 25.0, 30.0]
  sensing:
    symbols_fraction: 0.07142857142857142  # 1 of 14 symbols per slot
    duty_cycle: 0.32                        # 32 ms CPI per 0.1 s
  e2:
    loop_delay_s: 0.02
    loop_delay_sweep_s: [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
    tau_ho_s: 0.02
    tau_ho_sweep_s: [0.0, 0.02, 0.05, 0.08]
    report_period_s: 0.1
  predict:
    tau_max_s: 3.0
    tau_step_s: 0.05
    ue_sigma_m: 1.0
    los_block_db: 10.0
    los_clear_db: 3.0
  grids:  # 24 points each
    xapp: {budget: [2, 4], horizon_s: [0.5, 1.0, 2.0, 3.0], hold_s: [0.2, 0.5, 1.0]}
    a3: {offset_db: [1.0, 3.0], hysteresis_db: [1.0, 2.0, 3.0], ttt_s: [0.04, 0.08, 0.16, 0.32]}
    trend: {window_s: [0.1, 0.2, 0.5], drop_db: [3.0, 5.0], horizon_s: [0.25, 0.5, 1.0, 2.0]}
  filter_a: 0.5
  extra_h3_margin_db: 15.0
